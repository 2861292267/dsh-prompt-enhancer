# dsh-prompt-enhancer — bundle layer.
#
# This is the file `dsh.bundle.patch` in package.json points at. The profile
# applies it while composing its loader tree, which is why the profile lists
# `@local/dsh-prompt-enhancer` in `dsh.profile.bundles`.
#
# `- insert:` is required here and not optional: this layer starts from an empty
# entry list, so the plugin's row has to be inserted rather than targeted.
#
# `name` is the PACKAGE name, matching every working row in this profile
# (dsh-rotakit, dsh-mnemon, @nanmicoder/dsh-agent-teams …). The package is
# resolvable because the profile declares it as
# `link:D:/DeepSeek Harness工作区/插件推荐/dsh-prompt-enhancer`, which puts it in
# the profile's node_modules — verified by resolveBundleDir() in the test suite.
#
# Config keys (all optional):
#   provider      - provider route for the rewrite; set it explicitly, because
#                   leaving it out sent provider=undefined and failed the call
#   model         - model id for the rewrite; same reason
#   defaultStyle  - default | expand | concise | structured  (default: default)
#   slashCommand  - expose /enhance                          (default: true)
#
# `defaultStyle: default` reproduces WorkBuddy's own behaviour with no extra
# guidance appended to its instruction.
- insert:
    - id: prompt-enhancer
      name: '@local/dsh-prompt-enhancer'
      config:
        provider: workbuddy-xdpool
        model: deepseek-v4.1-flash
        defaultStyle: default
        slashCommand: true
